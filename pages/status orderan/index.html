      <main class="tracker-page">
        <div class="glass-card tracker-box">
          <h2>LIVE ORDER TRACKER</h2>
          <p style="color: #aaa; font-size: 0.88rem;">Masukkan ID Pesanan yang kamu dapatkan saat order di WA.</p>

          <div class="tracker-input-group">
            <input type="text" id="trackInput" placeholder="Contoh: YMA-001">
            <button type="button" onclick="checkOrderStatus()">Cek</button>

    <!-- SCRIPT LOGIKA TRACKER -->
    <script>
      // 1. INSIALISASI SUPABASE CLIENT (Menggunakan variabel 'supabaseClient' agar tidak bentrok)
      const SUPABASE_URL = "https://xmdcyrlyfgukalftiejh.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtZGN5cmx5Zmd1a2FsZnRpZWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MTI3MDAsImV4cCI6MjEwNjM4ODcwMH0.yn44MLze47vh636upeVtInalpTjxVfYbA9xR3VEEpD0";
      
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // 2. FUNGSI CEK STATUS ORDER
      async function checkOrderStatus() {
        const orderId = document.getElementById('trackInput').value.trim();
        const resultDiv = document.getElementById('trackerResult');

        if (!orderId) {
          resultDiv.innerHTML = "<p style='color: #ff4d4d; text-align:center;'>Masukkan ID Pesanan terlebih dahulu!</p>";
          return;
        }

        resultDiv.innerHTML = "<p style='text-align:center; color:#aaa;'>Mencari data...</p>";

        try {
          // Mengambil data dari Supabase
          const { data, error } = await supabaseClient
            .from('orders')
            .select('*')
            .eq('order_id', orderId)
            .maybeSingle();

          if (error || !data) {
            resultDiv.innerHTML = "<p style='color: #ff4d4d; text-align:center;'>ID Pesanan tidak ditemukan atau salah.</p>";
            return;
          }

          // Format class status
          const statusText = data.status || 'Queued';
          const badgeClass = statusText.toLowerCase().replace(/\s+/g, '-');

          resultDiv.innerHTML = `
            <div class="status-card" style="margin-top: 20px; padding: 16px; background: rgba(255,255,255,0.05); border-radius: 8px;">
              <h4 style="margin-top:0; color: #f4b033;">Order ID: ${data.order_id}</h4>
              <p style="margin: 6px 0;"><strong>Nama:</strong> ${data.customer_name}</p>
              <p style="margin: 6px 0;"><strong>Layanan:</strong> ${data.service_type}</p>
              <p style="margin: 6px 0;">
                <strong>Status:</strong> 
                <span class="status-badge ${badgeClass}" style="padding: 4px 8px; border-radius: 4px; font-weight: bold;">${statusText}</span>
              </p>
            </div>
          `;
        } catch (err) {
          console.error("Error fetching order:", err);
          resultDiv.innerHTML = "<p style='color: #ff4d4d; text-align:center;'>Terjadi kesalahan koneksi database.</p>";
        }
      }
    </script>

    <script src="../../assets/js/main.js?v=20260915"></script>
